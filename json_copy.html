<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERRAFORM JSON Copy</title>
<style>
:root{--bg:#f3f7f5;--ink:#14302b;--ac:#0f766e;--line:#cfe0da;--mute:#6a827c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,monospace}
header{padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}h1{margin:0;font-size:18px;color:var(--ac)}header p{margin:2px 0 0;color:var(--mute);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}nav button{border:1px solid var(--line);background:#fff;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:16px 24px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.btn{border:1px solid var(--ac);background:var(--ac);color:#fff;padding:6px 14px;font:inherit;font-size:12px;cursor:pointer}.btn.alt{background:#fff;color:var(--ac)}
.sec{background:#fff;border:1px solid var(--line);margin-bottom:10px}.sec summary{cursor:pointer;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
pre{margin:0;padding:12px;border-top:1px solid var(--line);overflow:auto;max-height:420px;font-size:12px;background:#fafdfc}
</style></head><body>
<header><h1>TERRAFORM - JSON files</h1><p>Pick a file, then copy the whole file or a single section.</p><nav id="nav"></nav></header>
<main><div class="bar"><b id="fname"></b><button class="btn" id="all">Copy whole file</button></div><div id="out"></div></main>
<script>
const FILES=['kb.json','case1_arid.json','case2_wetland.json','case3_saline.json','case4_pasture.json','case5_deforested.json','all_cases.json'];
let cur=FILES[0];
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function copy(text,btn){try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
 const o=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=o,1200)}
async function load(f){cur=f;
 document.getElementById('nav').innerHTML=FILES.map(x=>`<button class="${x===f?'on':''}" onclick="load('${x}')">${x}</button>`).join('');
 document.getElementById('fname').textContent='kb/'+f;
 const raw=await (await fetch('kb/'+f+'?'+Date.now())).text(), d=JSON.parse(raw);
 document.getElementById('all').onclick=e=>copy(JSON.stringify(d,null,2),e.target);
 const out=document.getElementById('out');out.innerHTML='';
 Object.entries(d).forEach(([k,v])=>{const txt=JSON.stringify({[k]:v},null,2), body=JSON.stringify(v,null,2);
  const s=document.createElement('details');s.className='sec';
  s.innerHTML=`<summary><span><b>"${k}"</b> <span style="color:var(--mute)">${Array.isArray(v)?v.length+' items':typeof v}</span></span><span><button class="btn alt" data-m="v">Copy value</button> <button class="btn alt" data-m="kv">Copy "${k}": ...</button></span></summary><pre>${esc(body)}</pre>`;
  s.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.preventDefault();copy(b.dataset.m==='v'?body:txt.slice(2,-2).trim(),b)});
  out.appendChild(s)})}
load(cur);
</script></body></html>
